server:
  port: 8080

spring:
  application:
    name: datingapp
  data:
    mongodb:
      uri: mongodb://admin:password@localhost:27017/datingdb?authSource=admin
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: user-photos

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  queue:
    capacity: 100





